name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: find
        run: |
          echo "Top of repo:"
          ls -la
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle found anywhere in the repo. Did you upload the .zip instead of its contents?"
            find . -not -path './.git/*' | head -n 50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No wrapper needed: Gradle 8.1.1 is what ForgeGradle 6 for 1.20.1 expects.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: magi-djinn-rpg-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
